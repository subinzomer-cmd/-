<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#652D90">
<title>CU 꿀조합 레시피 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--pu:#652D90;--pd:#461C68;--gr:#8DB91F;--bg:#F5EEFA;--card:#fff;--tx:#2A1B3D;--mut:#7C7090;--ln:#E8DCF3;--chip:#EFE8F6;--hot:#E0431F;--warn:#FFE9B0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17101f;--card:#241a31;--tx:#f3ecfa;--mut:#a698b8;--ln:#3a2c4b;--chip:#33264a;--warn:#4a3b12}}
:root[data-theme="dark"]{--bg:#17101f;--card:#241a31;--tx:#f3ecfa;--mut:#a698b8;--ln:#3a2c4b;--chip:#33264a;--warn:#4a3b12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#2B1D3A;color:var(--tx);font-family:"Jua","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;letter-spacing:0;display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
.phone{width:100%;max-width:410px;height:min(860px,calc(100vh - 24px));background:var(--bg);border-radius:44px;border:9px solid #17101f;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:430px){.phone{height:100dvh;max-width:none;border:0;border-radius:0}}
header{background:var(--pu);color:#fff;padding:14px 16px 12px;flex:none;border-bottom:4px solid var(--gr)}
header b{font-size:1.08rem;display:block}
header small{opacity:.85;font-size:.75rem}
.sub{display:flex;background:var(--card);border-bottom:1px solid var(--ln);flex:none;overflow-x:auto;scrollbar-width:none}
.sub button{flex:1;min-width:max-content;border:0;background:none;color:var(--mut);font:600 .86rem inherit;font-family:inherit;padding:12px 12px;min-height:44px;position:relative;cursor:pointer}
.sub button.on{color:var(--pu)}
.sub button.on:after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--pu)}
@media (prefers-color-scheme:dark){.sub button.on,.tb.on{color:#d9b8ff}.sub button.on:after{background:#d9b8ff}}
main{flex:1;overflow-y:auto;padding:12px 12px 20px;overscroll-behavior:contain}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));flex:none}
.tb{flex:1;border:0;background:none;color:var(--mut);font:600 .66rem inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;cursor:pointer}
.tb i{font-style:normal;font-size:1.25rem;width:42px;border-radius:14px;line-height:1.5}
.tb.on{color:var(--pu)}.tb.on i{background:var(--chip)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(40,20,60,.06),0 6px 18px rgba(40,20,60,.06)}
.card.sel{box-shadow:inset 0 0 0 2px var(--gr)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:0;background:var(--chip);color:var(--tx);border-radius:18px;padding:7px 13px;font:600 .8rem inherit;font-family:inherit;min-height:34px;cursor:pointer}
.chip.on{background:var(--pu);color:#fff}
.btn{border:0;background:var(--pu);color:#fff;border-radius:14px;padding:11px 16px;font:700 .88rem inherit;font-family:inherit;min-height:44px;cursor:pointer}
.btn.soft{background:var(--chip);color:var(--pu)}
@media (prefers-color-scheme:dark){.btn.soft{color:#d9b8ff}}
.btn:disabled{opacity:.4}
.btn:active,.chip:active{transform:scale(.96)}
.it{display:inline-block;background:var(--chip);border-radius:9px;padding:3px 8px;margin:2px 2px 0 0;font-size:.74rem;font-weight:600}
.it.x{text-decoration:line-through;color:var(--hot)}
.pr{color:var(--pu);font-weight:800}
@media (prefers-color-scheme:dark){.pr{color:#d9b8ff}}
.note{color:var(--mut);font-size:.75rem}
.pill{display:inline-block;background:#E8F3C8;color:#3d5410;border-radius:9px;padding:2px 8px;font-size:.7rem;font-weight:700}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;background:var(--gr);border-radius:9px;transition:width .3s}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.slot{border:2px dashed var(--ln);border-radius:16px;padding:10px;min-height:84px;background:var(--card)}
.slot.f{border:2px solid var(--gr)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat div{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:.78rem}
.stat b{display:block;font-size:1rem}
input[type=text],input[type=range]{width:100%}
input[type=text]{background:var(--chip);color:var(--tx);border:0;border-radius:14px;padding:11px 14px;font:16px inherit;font-family:inherit}
input[type=range]{accent-color:var(--pu)}
h4{margin:6px 0 8px;font-size:.95rem}
.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,16px);background:#2A1B3D;color:#fff;padding:10px 16px;border-radius:22px;font-size:.82rem;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fav{border:0;background:none;font-size:1.1rem;cursor:pointer;min-width:36px;min-height:36px;filter:grayscale(1);opacity:.45}
.fav.on{filter:none;opacity:1}
#login{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#652D90,#461C68);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:28px 26px calc(28px + env(safe-area-inset-bottom,0px));gap:10px}
#login h1{margin:6px 0 0;font-size:1.7rem;line-height:1.25}
#login p{margin:0 0 10px;opacity:.85;font-size:.88rem}
#login .logo{font-size:3.2rem}
#login .btn{background:#8DB91F;color:#1B2B00;width:100%}
#login .ghost{background:none;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
#lerr{min-height:1.2em;font-size:.8rem;color:#FFD6C9}
*{font-synthesis:none}
main{background-image:radial-gradient(var(--ln) 1.4px,transparent 1.4px);background-size:20px 20px}
.cub{display:inline-block;background:#9CCB3B;color:#2B0F47;font-size:.85rem;padding:1px 9px;border-radius:14px;transform:rotate(-4deg);box-shadow:0 2px 0 #6F9420;margin-right:4px}
.card{border-radius:22px}
.btn{box-shadow:0 3px 0 #461C68;font-size:.92rem}
.btn.soft{box-shadow:0 3px 0 #D9C4EE}
#login .btn{box-shadow:0 3px 0 #6F9420}
.chip{box-shadow:0 2px 0 rgba(101,45,144,.18);font-size:.85rem}
.chip.on{box-shadow:0 2px 0 #461C68}
.sub button{font-size:.92rem}.tb{font-size:.7rem}
.medal{font-size:1.3rem;margin-right:4px}
.hint{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;background:#FFF9E6;color:#4a3d00;border:2px dashed #9CCB3B;border-radius:16px;padding:9px 8px 9px 12px;margin-bottom:10px;font-size:.84rem;line-height:1.4}
.hint button{border:0;background:none;color:inherit;font-size:1rem;min-width:30px;min-height:30px;cursor:pointer}
@media (prefers-color-scheme:dark){.hint{background:#3a3318;color:#ffe9a0}}
.guide{border:2px solid var(--gr)}
.gs{display:flex;align-items:center;gap:10px;margin:9px 0;opacity:.55}
.gs.now{opacity:1}.gs.ok{opacity:.8}
.gs span.t{flex:1;font-size:.9rem}
.gn{width:28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none;font-size:.85rem}
.gs.ok .gn{background:#9CCB3B;color:#1B2B00}.gs.now .gn{background:var(--pu);color:#fff}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
#tour{position:absolute;inset:0;z-index:70;background:rgba(20,10,30,.72);display:none;align-items:center;justify-content:center;padding:22px}
.tbox{background:var(--card);border-radius:28px;padding:22px 20px 14px;text-align:center;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.tbox h3{margin:0;font-size:1.3rem;font-weight:400}.tbox p{margin:0 0 6px;color:var(--mut);font-size:.92rem;line-height:1.5}
.tbig{font-size:2.4rem;line-height:1}.tstep{color:var(--pu);font-size:.8rem}
.dots{display:flex;gap:6px;margin:4px 0 8px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--ln)}.dots i.on{background:var(--pu);width:22px;border-radius:5px}
.skip{border:0;background:none;color:var(--mut);font-family:inherit;font-size:.82rem;min-height:40px;cursor:pointer}
.tbox .btn{width:100%}
.nk{font-size:.74rem;color:var(--mut);margin-bottom:3px}
.mdn{margin-top:7px;font-size:.68rem;color:#5b4a00;background:#FFF3C4;border-radius:10px;padding:4px 9px;display:inline-block}
@media (prefers-color-scheme:dark){.mdn{background:#4a3b12;color:#ffe9a0}}
.hero{display:flex;align-items:center;justify-content:space-between;gap:6px;background:linear-gradient(135deg,#652D90 0%,#8E4BC4 60%,#8DB91F 135%);color:#fff;border-radius:26px;padding:18px 16px 18px 20px;box-shadow:0 4px 0 #461C68;margin-bottom:12px;overflow:hidden}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mini{border:0;background:var(--card);color:var(--tx);border-radius:18px;padding:10px 4px;text-align:center;font:inherit;font-family:inherit;font-size:.74rem;color:var(--mut);box-shadow:0 2px 0 var(--ln);min-height:56px;cursor:pointer}
.mini b{display:block;font-size:1.1rem;color:var(--pu);font-weight:400}
@media (prefers-color-scheme:dark){.mini b{color:#d9b8ff}}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{border:0;background:var(--card);color:var(--tx);border-radius:22px;padding:14px;text-align:left;font-family:inherit;display:flex;flex-direction:column;gap:2px;min-height:112px;cursor:pointer;box-shadow:0 3px 0 var(--ln)}
.tile:active{transform:translateY(2px)}
.tile .bd{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:6px;color:#2A1B3D}
.tile b{font-size:1rem;font-weight:400}
.tile small{color:var(--mut);font-size:.72rem}
.hot{background:linear-gradient(135deg,#FFF6D6,#F3F9DC);color:#2A1B3D;border:2px solid #9CCB3B}
.hot .note{color:#5d5a4a}
.sec{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;font-size:1.02rem}
#login{justify-content:flex-start;overflow-y:auto;gap:8px;padding-top:calc(18px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,#9B58CF 0%,#652D90 42%,#461C68 100%)}
#login>*{flex:none}
#login h1,#login p{text-align:center}
#login h1{font-size:1.9rem;text-shadow:0 3px 0 rgba(0,0,0,.18)}
#login input{background:#fff;color:#2A1B3D;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#login .scene{width:100%;height:auto;display:block}
.hop{animation:hop 1.6s ease-in-out infinite}
.wave{animation:wave .9s ease-in-out infinite;transform-origin:52px 42px}
.tw{animation:tw 1.8s ease-in-out infinite}.tw:nth-of-type(2n){animation-delay:.6s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.hop,.wave,.tw{animation:none}}
.gauge{font-size:.72rem;color:var(--mut);display:flex;justify-content:space-between}
.bar.hot i{background:linear-gradient(90deg,var(--gr),#FF5A36)}
.who{display:flex;align-items:center;gap:6px;font-size:.75rem}
.who button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:12px;padding:4px 10px;font:600 .72rem inherit;font-family:inherit;min-height:30px;cursor:pointer}

.plate{position:relative;width:230px;height:230px;margin:6px auto 4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#f4eefa 62%,#e3d6f0 100%);box-shadow:0 8px 0 #cdbbe0,0 16px 22px rgba(40,20,60,.22)}
.plate .rim{position:absolute;inset:16px;border-radius:50%;border:2px dashed #d9c9ea}
.pf{position:absolute;transform:translate(-50%,-50%);font-size:58px;line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18))}
.zzan{text-align:center;font-size:1.2rem;color:var(--pu);margin-bottom:2px}
@media (prefers-color-scheme:dark){.zzan{color:#d9b8ff}}
.pnames{text-align:center;margin:6px 0 10px}
.res{border-top:2px dashed var(--ln);padding-top:10px}
.fresh .plate{animation:plin .55s cubic-bezier(.2,1.5,.4,1) both}
.fresh .pf{animation:pfin .6s cubic-bezier(.2,1.6,.4,1) both}
.fresh .zzan{animation:zz .6s ease-out both}
.fresh .pnames,.fresh .res{animation:rise .6s ease-out 1s both}
@keyframes plin{0%{transform:scale(.2) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes pfin{0%{transform:translate(-50%,-260%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes zz{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fresh .plate,.fresh .pf,.fresh .zzan,.fresh .pnames,.fresh .res{animation:none}}

.ico{vertical-align:-5px;margin-right:2px;flex:none}
.slot .ico{display:block;margin:2px 0 3px}
.dishwrap{text-align:center;margin:2px 0}
.dish{width:100%;max-width:340px;height:auto;overflow:visible;filter:drop-shadow(0 6px 8px rgba(40,20,60,.15))}
.fresh .dish{animation:serve .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes serve{0%{transform:translateY(-60px) scale(.6) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.stm{animation:stm 2.4s ease-in-out infinite}
@keyframes stm{0%{opacity:0;transform:translateY(8px)}50%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.fresh .dish,.stm{animation:none}}.visitor-count{
  flex:none;
  padding:8px 12px;
  text-align:center;
  color:var(--mut);
  background:var(--card);
  border-top:1px solid var(--ln);
  font-size:.75rem;
}
</style>
</head>
<body>
<div class="phone">
  <header class="row"><div><b><span class="cub">CU</span> 꿀조합 레시피 연구소</b><small>재료를 담고, 비율을 연구하고, 같이 나눠요</small></div><div class="who"><button id="who" onclick="go(5)"></button><button onclick="logout()">로그아웃</button></div></header>
  <nav class="sub" id="sub"></nav>
  <main id="app"></main><main id="app"></main>
<div id="visitor-count" class="visitor-count" aria-live="polite">

    <h1>CU <span style="color:#9CCB3B">꿀조합</span><br>레시피 연구소</h1>
    <p>로그인하고 나만의 꿀조합을 저장해 보세요</p>
    <input type="text" id="ln" placeholder="닉네임 (2~12자)" maxlength="12" autocomplete="nickname">

  const st=[["💰","예산 정하고 조합 고르기","가성비 공식 열기","go(0,1)"],["🧪","재료 담아 작업대 채우기","재료 담러 가기","go(1)"],["🏆","내 조합 광장에 올리기","작업대로 가기","go(2)"]];
  if(n<0)return `<div class="card guide"><div class="row"><b>🎉 가이드 완료! 이제 타일에서 골라 써보세요</b><button class="chip" onclick="showTour(0)">다시 보기</button></div></div>`;
  return `<div class="card guide"><div class="row"><b>🚀 처음이라면 이 순서로!</b><button class="chip" onclick="showTour(0)">설명 보기</button></div>`+st.map((s,i)=>`<div class="gs ${d[i]?"ok":i===n?"now":""}"><span class="gn">${d[i]?"✓":i+1}</span><span class="t">${s[0]} ${s[1]}</span>${i===n?`<button class="btn pulse" onclick="${s[3]}">${s[2]}</button>`:""}</div>`).join("")+`</div>`;
}
function showTour(i){
  const P=[["💰","1. 예산으로 고르기","홈의 [가성비 공식]에서 예산을 정하면, 그 돈으로 먹을 수 있는 가성비 좋은 조합이 나와요."],["🧪","2. 작업대에서 만들기","[재료] 탭에서 [담기]를 누르면 작업대 4칸이 채워지고, 가격과 열량이 바로 계산돼요."],["🏆","3. 광장에 올리기","완성한 조합은 [광장에 올리기]로 공유해요. 👍을 많이 받으면 인기 조합이 돼요!"]];
  i=i||0;if(!i){S.hintOff=0;sv("cuHint",0)}
  let el=$("tour");if(!el){el=document.createElement("div");el.id="tour";document.querySelector(".phone").appendChild(el)}
  const p=P[i],last=i===P.length-1;
  el.innerHTML=`<div class="tbox" role="dialog" aria-label="사용 방법 안내">${drop(72)}<div class="tstep">${i+1} / ${P.length}</div><div class="tbig">${p[0]}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="dots">${P.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div><button class="btn" onclick="${last?"endTour()":"showTour("+(i+1)+")"}">${last?"시작하기!":"다음"}</button><button class="skip" onclick="endTour()">건너뛰기</button></div>`;
  el.style.display="flex";
}
function endTour(){sv("cuTour",1);const el=$("tour");if(el)el.style.display="none";draw()}
if(S.user)enter(false);else draw();
</script>
